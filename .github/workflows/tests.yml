name: Integrated UR5e checks
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate, test, simulate three cycles, analyze
        env:
          MPLBACKEND: Agg
        run: python scripts/verify_all.py
      - name: Upload current execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-ur5e-evidence
          path: |
            results/integrated/
            results/logs/
            results/figures/
